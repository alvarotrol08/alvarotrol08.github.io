  <meta name="twitter:description" content="Producción musical, grabación y desarrollo de aparatos musicales en Madrid.">
  <meta name="twitter:image" content="https://webowebo.com/assets/images/og-image.jpg">

  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "WEBO",
    "url": "https://webowebo.com/",
    "image": "https://webowebo.com/assets/images/og-image.jpg",
    "jobTitle": "Productor musical",
    "description": "Producción musical, grabación y desarrollo de aparatos musicales en Madrid."
  }
  </script>

  <!-- Cambia esta versión al publicar cambios de CSS o JavaScript para evitar mezclar archivos en caché. -->
  <script defer src="assets/js/content.js?v=20260820-1"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="assets/js/animations.js?v=20260820-1"></script>
  <script defer src="assets/js/app.js?v=20260820-2"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <img
    class="bg-photo"
    id="bg-photo"
    src="assets/images/background.jpg"
    width="2560"
    height="1089"
    alt=""
    fetchpriority="high"
    decoding="async"
  >

  <nav class="navbar" aria-label="Navegación principal">
    <a class="nav-logo" href="#home" aria-label="WEBO, ir al inicio">WEBO</a>
    <div class="nav-links">
      <a data-route="bio" href="#bio">Bio</a>
      <a data-route="gear" href="#aparatos">Aparatos</a>
      <a data-route="portfolio" href="#portfolio">Portfolio</a>
      <a data-route="contact" href="#contacto">Contacto</a>
    </div>
  </nav>

  <main id="main-content">
    <section id="home" class="screen screen-home" data-route-screen="home">
      <div class="screen-content screen-content-home">
        <h1 class="sr-only">WEBO - Productor</h1>
        <p class="sr-only">Producción musical, grabación y desarrollo de aparatos musicales en Madrid.</p>
      </div>
    </section>

    <section id="bio" class="screen bio-screen" data-route-screen="bio" hidden>
      <h1 class="sr-only route-heading" tabindex="-1">Bio</h1>
      <p class="sr-only" id="bio-accessible-text"></p>
      <div class="bio-story" id="bio-story">
        <div class="bio-stage" id="bio-stage">
          <figure class="bio-hero-visual">
            <img id="bio-hero-image" alt="" decoding="async">
          </figure>

          <div class="bio-copy-track" aria-hidden="true">
            <p class="bio-copy-line" id="bio-copy-line"></p>
          </div>

          <figure class="bio-parallax-image bio-parallax-image-top" aria-hidden="true">
            <img id="bio-parallax-top-image" alt="" loading="lazy" decoding="async">
          </figure>

          <figure class="bio-parallax-image bio-parallax-image-bottom" aria-hidden="true">
            <img id="bio-parallax-bottom-image" alt="" loading="lazy" decoding="async">
          </figure>

          <div class="bio-final" id="bio-final">
            <figure class="bio-final-image bio-final-image-left">
              <img id="bio-left-image" alt="" loading="lazy" decoding="async">
            </figure>

            <div class="bio-final-center">
              <p class="bio-long-copy" id="bio-long-copy" aria-hidden="true"></p>

              <nav class="bio-socials" aria-label="Redes sociales de WEBO">
                <a class="bio-social-link" data-social="instagram" href="#" aria-label="Instagram">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle class="icon-dot" cx="17.4" cy="6.7" r="1"></circle>
                  </svg>
                </a>
                <a class="bio-social-link" data-social="linkedin" href="#" aria-label="LinkedIn">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <circle class="icon-dot" cx="7.2" cy="8" r="1"></circle>
                    <path d="M7.2 11v6M11 17v-6m0 2.4c1-2.7 5.8-2.4 5.8 1.5V17"></path>
                  </svg>
                </a>
                <a class="bio-social-link" data-social="gmail" href="#contacto" aria-label="Contacto">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m4 7 8 6 8-6"></path>
                  </svg>
                </a>
                <a class="bio-social-link" data-social="soundcloud" href="#" aria-label="SoundCloud">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3.5 14v2m2-4v6m2-8v9m2-10v10m2-11v11h6.3a3.2 3.2 0 0 0 .3-6.4A5 5 0 0 0 9.5 10"></path>
                  </svg>
                </a>
                <a class="bio-social-link" data-social="youtube" href="#" aria-label="YouTube">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2.5" y="5.5" width="19" height="13" rx="4"></rect>
                    <path d="m10 9 5 3-5 3Z"></path>
                  </svg>
                </a>
              </nav>

              <img class="bio-mark" src="assets/images/favicon.png" width="192" height="192" alt="Logo de WEBO">
            </div>

            <figure class="bio-final-image bio-final-image-right">
              <img id="bio-right-image" alt="" loading="lazy" decoding="async">
            </figure>
          </div>

          <div class="scroll-banner" aria-hidden="true">
            <div class="scroll-banner-track">
              <div class="scroll-banner-group"></div>
              <div class="scroll-banner-group"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="gear" class="screen gear-screen" data-route-screen="gear" hidden>
      <div class="gear-side-gallery" id="gear-side-gallery" aria-hidden="true"></div>

      <div class="screen-content gear-center">
        <h1 class="sr-only route-heading" tabindex="-1">Aparatos</h1>
        <div class="aparato-stack" id="gear-grid"></div>
        <p class="gear-more-note" id="gear-more-note"></p>
      </div>
    </section>

    <section id="aparato-detail" class="screen aparato-detail-screen" data-route-screen="aparato-detail" hidden>
      <article class="aparato-process">
        <h1 class="sr-only route-heading" id="aparato-detail-name" tabindex="-1"></h1>
        <a class="aparato-process-back" href="#aparatos">← Volver a aparatos</a>
        <div class="aparato-process-flow" id="aparato-process-flow"></div>
      </article>
    </section>

    <section id="portfolio" class="screen portfolio-screen" data-route-screen="portfolio" hidden>
      <div class="screen-content portfolio-content">
        <h1 class="sr-only route-heading" tabindex="-1">Portfolio</h1>
        <div class="portfolio-stack" id="portfolio-grid"></div>
      </div>
    </section>

    <section id="portfolio-detail" class="screen aparato-detail-screen" data-route-screen="portfolio-detail" hidden>
      <article class="aparato-process">
        <h1 class="sr-only route-heading" id="portfolio-detail-name" tabindex="-1"></h1>
        <a class="aparato-process-back" href="#portfolio">← Volver a portfolio</a>
        <div class="aparato-process-flow" id="portfolio-detail-flow"></div>
      </article>
    </section>

    <section id="contact" class="screen contact-screen" data-route-screen="contact" hidden>
      <div class="screen-content contact-content">
        <h1 class="sr-only route-heading" tabindex="-1">Contacto</h1>
        <img class="contact-mark" src="assets/images/favicon.png" width="192" height="192" alt="Logo de WEBO">
        <p class="page-sub page-sub-contact">Respondo rápido</p>
        <form class="funk-form" id="contact-form" action="https://formspree.io/f/mppajzry" method="post">
          <label for="contact-name">Nombre</label>
          <input id="contact-name" type="text" name="name" autocomplete="name" placeholder="Tu nombre" required>

          <label for="contact-email">Email</label>
          <input id="contact-email" type="email" name="email" autocomplete="email" inputmode="email" placeholder="tu@email.com" required>

          <label for="contact-message">Mensaje</label>
          <textarea id="contact-message" name="message" rows="4" placeholder="Escribe aquí..." required></textarea>

          <button type="submit">Enviar</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>

        <nav class="bio-socials contact-socials" aria-label="Redes sociales de WEBO">
          <a class="bio-social-link" data-social="instagram" href="#" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4"></circle>
              <circle class="icon-dot" cx="17.4" cy="6.7" r="1"></circle>
            </svg>
          </a>
          <a class="bio-social-link" data-social="linkedin" href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle class="icon-dot" cx="7.2" cy="8" r="1"></circle>
              <path d="M7.2 11v6M11 17v-6m0 2.4c1-2.7 5.8-2.4 5.8 1.5V17"></path>
            </svg>
          </a>
          <a class="bio-social-link" data-social="gmail" href="#contacto" aria-label="Contacto">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
          </a>
          <a class="bio-social-link" data-social="soundcloud" href="#" aria-label="SoundCloud">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 14v2m2-4v6m2-8v9m2-10v10m2-11v11h6.3a3.2 3.2 0 0 0 .3-6.4A5 5 0 0 0 9.5 10"></path>
            </svg>
          </a>
          <a class="bio-social-link" data-social="youtube" href="#" aria-label="YouTube">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2.5" y="5.5" width="19" height="13" rx="4"></rect>
              <path d="m10 9 5 3-5 3Z"></path>
            </svg>
          </a>
        </nav>
      </div>
    </section>
  </main>

  <noscript>
    <div class="noscript-message">Esta web necesita JavaScript para navegar por las secciones. Puedes escribir a <a href="mailto:webo.managment@gmail.com">webo.managment@gmail.com</a>.</div>
  </noscript>
</body>
</html>
