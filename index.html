<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEBO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bungee&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="webo_logo_white copy.png">

<style>
:root{
  --white:#ffffff;
  --font-display:'Monoton', cursive;
  --font-heading:'Bungee', sans-serif;
  --font-body:'Quicksand', sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html, body{
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:var(--font-body);
  color:var(--white);
  -webkit-tap-highlight-color:transparent;
}
body{ position:fixed; inset:0; overscroll-behavior:none; }
button, a{ font-family:inherit; }
:focus-visible{ outline:2px solid rgba(255,255,255,.7); outline-offset:3px; }

/* ── FONDO FOTO ── */
.bg-photo{
  position:fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:0;
  filter:blur(0px) brightness(1);
  transform:scale(1);
  transition:filter .55s ease, transform .55s ease, brightness .55s ease;
}
.bg-photo.blurred{
  filter:blur(22px) brightness(.45);
  transform:scale(1.07);
}

/* ── NAV FLOTANTE ── */
.navbar{
  position:fixed;
  top:0; left:0; right:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:22px 32px;
  background:none;
}
.nav-logo{
  font-family:var(--font-display);
  font-size:clamp(1rem, 2vw, 1.5rem);
  color:var(--white);
  text-shadow:0 0 12px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.8);
  background:none;
  border:none;
  cursor:pointer;
  letter-spacing:.06em;
}
.nav-links{
  display:flex;
  gap:clamp(14px, 2.6vw, 32px);
  overflow-x:auto;
  scrollbar-width:none;
}
.nav-links::-webkit-scrollbar{ display:none; }
.nav-links button{
  background:none;
  border:none;
  font-family:var(--font-heading);
  font-size:clamp(.6rem, 1.2vw, .8rem);
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--white);
  cursor:pointer;
  opacity:.55;
  text-shadow:0 1px 6px rgba(0,0,0,.9);
  transition:opacity .2s;
  white-space:nowrap;
}
.nav-links button:hover{ opacity:1; }
.nav-links button.active{
  opacity:1;
  text-decoration:underline;
  text-underline-offset:4px;
}

/* ── PANTALLAS ── */
main{
  position:fixed;
  inset:0;
  z-index:2;
  overflow:hidden;
  pointer-events:none;
}
.screen{
  position:absolute; inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 24px 24px;
  opacity:0;
  visibility:hidden;
  transition:opacity .35s ease;
  pointer-events:none;
}
.screen.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

/* ── TEXTO Y ELEMENTOS SUELTOS (sin panel) ── */
.page-title{
  font-family:var(--font-heading);
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:clamp(1.6rem, 4vw, 3rem);
  color:var(--white);
  text-shadow:0 2px 14px rgba(0,0,0,.9);
  text-align:center;
  margin-bottom:10px;
}
.page-sub{
  text-align:center;
  opacity:.9;
  font-size:clamp(.8rem, 1.5vw, .95rem);
  text-shadow:0 1px 8px rgba(0,0,0,.9);
  margin-bottom:14px;
  max-width:500px;
}

/* ── GRIDS ── */
.grid-cards{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
  gap:14px;
  width:min(860px, 90vw);
}
.card{
  background:rgba(0,0,0,.38);
  border:1px solid rgba(255,255,255,.7);
  border-radius:14px;
  padding:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  text-align:center;
  transition:.2s;
  backdrop-filter:blur(4px);
}
.card:hover{ transform:translateY(-3px); background:rgba(0,0,0,.55); }
.card-soon{ opacity:.55; border-style:dashed; }
.card-emoji{ font-size:2rem; }
.card-name{ font-family:var(--font-heading); font-size:.82rem; }
.card-price{ font-weight:700; font-size:.82rem; }
.card-desc{ font-size:.72rem; opacity:.85; }
.card-link{
  margin-top:4px;
  padding:5px 14px;
  border:1px solid var(--white);
  border-radius:20px;
  background:transparent;
  color:var(--white);
  font-weight:700;
  text-decoration:none;
  font-size:.72rem;
  transition:.2s;
}
.card-link:hover{ background:rgba(255,255,255,.2); }

.gallery-item{
  aspect-ratio:1;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.7);
  overflow:hidden;
  cursor:pointer;
  backdrop-filter:blur(4px);
}
.gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-placeholder{
  width:100%; height:100%;
  background:rgba(0,0,0,.38);
  display:flex; align-items:center; justify-content:center;
  font-size:.75rem; padding:8px; text-align:center;
}

.pager{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:8px;
}
.pager-btn{
  background:rgba(0,0,0,.35);
  border:1px solid var(--white);
  color:var(--white);
  border-radius:20px;
  padding:6px 16px;
  cursor:pointer;
  font-size:.78rem;
  backdrop-filter:blur(4px);
  transition:.2s;
}
.pager-btn:hover{ background:rgba(255,255,255,.2); }
.page-indicator{ font-size:.78rem; opacity:.8; text-shadow:0 1px 6px rgba(0,0,0,.9); }

/* ── FORMULARIO ── */
.funk-form{
  display:flex;
  flex-direction:column;
  gap:11px;
  width:min(380px, 90vw);
}
.funk-form label{
  display:flex; flex-direction:column; gap:5px;
  font-size:.72rem; text-transform:uppercase; letter-spacing:.04em;
  text-shadow:0 1px 6px rgba(0,0,0,.9);
}
.funk-form input, .funk-form textarea{
  font-family:var(--font-body); font-size:.95rem;
  padding:9px 13px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.7);
  background:rgba(0,0,0,.38);
  color:var(--white);
  backdrop-filter:blur(4px);
  resize:none;
}
.funk-form input::placeholder, .funk-form textarea::placeholder{ color:rgba(255,255,255,.4); }
.funk-form input:focus, .funk-form textarea:focus{ outline:none; border-color:#fff; }
.funk-form button{
  align-self:center;
  padding:10px 28px;
  border-radius:30px;
  border:1px solid var(--white);
  background:rgba(0,0,0,.38);
  color:var(--white);
  font-family:var(--font-heading);
  font-size:.9rem;
  cursor:pointer;
  backdrop-filter:blur(4px);
  transition:.2s;
}
.funk-form button:hover{ background:rgba(255,255,255,.2); }
.form-status{ min-height:1.1em; text-align:center; font-size:.78rem; text-shadow:0 1px 6px rgba(0,0,0,.9); }

/* ── SECRET ── */
.rec-box{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.rec-video{ width:min(400px, 80vw); height:min(226px, 28vh); border-radius:12px; border:1px solid rgba(255,255,255,.7); }
.rec-title{ font-family:var(--font-heading); text-align:center; font-size:clamp(.9rem,2vw,1.2rem); text-shadow:0 2px 10px rgba(0,0,0,.9); }
.rec-artist{ opacity:.8; font-size:.82rem; text-shadow:0 1px 6px rgba(0,0,0,.9); }
.rec-note{ font-style:italic; font-size:.78rem; opacity:.8; text-align:center; max-width:440px; text-shadow:0 1px 6px rgba(0,0,0,.9); }
.rec-cover{
  width:min(170px, 38vw); aspect-ratio:1; border-radius:12px;
  border:1px solid rgba(255,255,255,.7);
  background:rgba(0,0,0,.38); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding:10px;
}
.rec-cover-title{ font-family:var(--font-heading); font-size:.85rem; }
.countdown{
  font-family:var(--font-heading);
  font-size:clamp(.72rem, 1.6vw, .95rem);
  letter-spacing:.03em;
  text-shadow:0 2px 10px rgba(0,0,0,.9);
  margin-top:6px;
}
.comments-wrap{
  width:min(600px, 90vw);
  max-height:26vh;
  overflow-y:auto;
  border-top:1px dashed rgba(255,255,255,.5);
  padding-top:8px;
  margin-top:4px;
}

/* ── LIGHTBOX ── */
.lightbox{
  position:fixed; inset:0;
  background:rgba(0,0,0,.88);
  display:none; align-items:center; justify-content:center;
  z-index:50;
}
.lightbox.active{ display:flex; }
.lightbox img{ max-width:82vw; max-height:80vh; border-radius:10px; border:1px solid rgba(255,255,255,.7); }
.lightbox-close{
  position:absolute; top:18px; right:24px;
  font-size:1.5rem; background:none; border:none; color:#fff; cursor:pointer;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<img class="bg-photo" id="bg-photo" src="Foto_Web-3.png" alt="">

<nav class="navbar">
  <button class="nav-logo" onclick="showScreen('home')">WEBO</button>
  <div class="nav-links">
    <button data-target="gear"    onclick="showScreen('gear')">Gear</button>
    <button data-target="plugins" onclick="showScreen('plugins')">Plugins</button>
    <button data-target="gallery" onclick="showScreen('gallery')">Gallery</button>
    <button data-target="events"  onclick="showScreen('events')">Events</button>
    <button data-target="contact" onclick="showScreen('contact')">Contact</button>
    <button data-target="secret"  onclick="showScreen('secret')">Secret</button>
  </div>
</nav>

<main>

  <section id="home" class="screen active"></section>

  <section id="gear" class="screen">
    <h2 class="page-title">Gear</h2>
    <p class="page-sub">Pedales y diseños hechos por WEBO. Catálogo en construcción 🛠️</p>
    <div class="grid-cards" id="gear-grid"></div>
    <div class="pager" id="gear-pager"></div>
  </section>

  <section id="plugins" class="screen">
    <h2 class="page-title">Plugins</h2>
    <p class="page-sub">VSTs creados por WEBO</p>
    <div class="grid-cards" id="plugins-grid"></div>
    <div class="pager" id="plugins-pager"></div>
  </section>

  <section id="gallery" class="screen">
    <h2 class="page-title">Gallery</h2>
    <p class="page-sub">Lo último que voy haciendo</p>
    <div class="grid-cards" id="gallery-grid"></div>
    <div class="pager" id="gallery-pager"></div>
  </section>

  <section id="events" class="screen">
    <h2 class="page-title">Events</h2>
    <p class="page-sub">Próximos directos y eventos de WEBO</p>
    <div class="grid-cards" id="events-grid"></div>
    <div class="pager" id="events-pager"></div>
  </section>

  <section id="contact" class="screen">
    <h2 class="page-title">Contact</h2>
    <p class="page-sub" style="margin-bottom:18px">Cuéntame qué necesitas y te respondo en cuanto pueda</p>
    <form class="funk-form" id="contact-form">
      <label>Nombre
        <input type="text" name="name" placeholder="Tu nombre" required>
      </label>
      <label>Contacto
        <input type="text" name="contact" placeholder="Email o teléfono" required>
      </label>
      <label>Mensaje
        <textarea name="message" rows="3" placeholder="Escribe aquí..." required></textarea>
      </label>
      <button type="submit">Enviar</button>
      <p class="form-status" id="form-status"></p>
    </form>
  </section>

  <section id="secret" class="screen">
    <h2 class="page-title">Secret</h2>
    <div class="rec-box" id="rec-box"></div>
    <p class="countdown" id="countdown"></p>
    <div class="comments-wrap" id="disqus_thread"></div>
  </section>

</main>

<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" alt="">
</div>

<script>
/* =====================================================
   🛠️  CONFIGURACIÓN — edita sólo esta sección
   ===================================================== */

const PRODUCTS_GEAR = [
  { name:'Funk Fuzz MK1', price:'89€', emoji:'🎛️', desc:'Pedal fuzz analógico, edición limitada.', link:'#', soon:false },
  { name:'Próximo pedal',  price:'—',  emoji:'🔧', desc:'Todavía en el banco de pruebas...', link:'#', soon:true  }
];

const PRODUCTS_PLUGINS = [
  { name:'FunkVerb', price:'Gratis', emoji:'🎚️', desc:'Reverb con carácter analógico.', link:'#', soon:false },
  { name:'Próximo VST', price:'—', emoji:'💾', desc:'Cociendo a fuego lento...', link:'#', soon:true }
];

// Para añadir fotos: { src:'images/mi-foto.jpg', caption:'Descripción' }
const PHOTOS = [
  { src:null, caption:'Sube tu primera foto 📷' },
  { src:null, caption:'Y la siguiente...' },
  { src:null, caption:'¡Sin límite!' }
];

const EVENTS_LIST = [
  { date:'18 Jul 2026', title:'WEBO Live', place:'Sala X, Madrid', desc:'Sesión funk en directo.', link:'#' },
  { date:'—', title:'Próximo evento', place:'Por anunciar', desc:'Aún organizando los detalles...', link:'#' }
];

// Crea cuenta en formspree.io y pega tu endpoint aquí
const FORM_ENDPOINT  = 'https://formspree.io/f/TU_ID_AQUI';
const FALLBACK_EMAIL = 'webo@tu-email.com';

// Secret: rota automáticamente cada lunes
const RECS_START = new Date(2025, 0, 6);
const RECS = [
  { type:'video', title:'Tu vídeo de la semana', artist:'Canal / Autor', embed:'https://www.youtube.com/embed/VIDEO_ID', note:'Por qué te va a encantar.' },
  { type:'album', title:'Tu álbum de la semana', artist:'Artista', link:'https://open.spotify.com/', note:'El disco que no puede faltar.' }
];

// Crea cuenta en disqus.com y pon tu shortname aquí
const DISQUS_SHORTNAME = 'TU-SHORTNAME-DISQUS';

/* =====================================================
   LÓGICA — no hace falta tocar nada de aquí en adelante
   ===================================================== */

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id===id));
  document.querySelectorAll('.nav-links button').forEach(b => b.classList.toggle('active', b.dataset.target===id));
  document.getElementById('bg-photo').classList.toggle('blurred', id!=='home');
  if(id==='secret') initDisqus();
}

function setupGrid(gridId, pagerId, items, render, perPage=6){
  const grid = document.getElementById(gridId);
  const pager = document.getElementById(pagerId);
  const pages = [];
  for(let i=0;i<items.length;i+=perPage) pages.push(items.slice(i,i+perPage));
  if(!pages.length) pages.push([]);
  let page=0;
  function draw(){
    grid.innerHTML = pages[page].map((it,i)=>render(it,page*perPage+i)).join('');
    pager.innerHTML = pages.length>1 ? `
      <button class="pager-btn" id="${gridId}-p">‹</button>
      <span class="page-indicator">${page+1} / ${pages.length}</span>
      <button class="pager-btn" id="${gridId}-n">›</button>` : '';
    if(pages.length>1){
      document.getElementById(gridId+'-p').onclick=()=>{page=(page-1+pages.length)%pages.length;draw();};
      document.getElementById(gridId+'-n').onclick=()=>{page=(page+1)%pages.length;draw();};
    }
  }
  draw();
}

function storeCard(it){
  return `<div class="card${it.soon?' card-soon':''}">
    <div class="card-emoji">${it.emoji}</div>
    <div class="card-name">${esc(it.name)}</div>
    <div class="card-price">${esc(it.price)}</div>
    <div class="card-desc">${esc(it.desc)}</div>
    ${it.soon?'<span class="card-desc">🔒 Próximamente</span>':`<a class="card-link" href="${it.link}" target="_blank" rel="noopener">Ver más</a>`}
  </div>`;
}

function eventCard(it){
  return `<div class="card">
    <div class="card-name">${esc(it.title)}</div>
    <div class="card-price">${esc(it.date)}</div>
    <div class="card-desc">${esc(it.place)}</div>
    <div class="card-desc">${esc(it.desc||'')}</div>
    <a class="card-link" href="${it.link}" target="_blank" rel="noopener">Más info</a>
  </div>`;
}

function galleryCard(p,idx){
  return `<div class="gallery-item" onclick="openLightbox(${idx})">
    ${p.src?`<img src="${p.src}" alt="${esc(p.caption||'')}">`:`<div class="photo-placeholder">📷 ${esc(p.caption||'')}</div>`}
  </div>`;
}

function openLightbox(idx){
  const p=PHOTOS[idx]; if(!p||!p.src) return;
  document.getElementById('lightbox-img').src=p.src;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('active'); }

function weekIndex(){
  const diff=new Date()-RECS_START;
  const w=Math.floor(diff/(7*864e5));
  return((w%RECS.length)+RECS.length)%RECS.length;
}

function renderRec(){
  const rec=RECS[weekIndex()];
  const box=document.getElementById('rec-box');
  if(rec.type==='video'){
    box.innerHTML=`<iframe class="rec-video" src="${rec.embed}" title="${esc(rec.title)}" frameborder="0" allow="autoplay;encrypted-media" allowfullscreen></iframe>
      <p class="rec-title">${esc(rec.title)}</p><p class="rec-artist">${esc(rec.artist)}</p><p class="rec-note">${esc(rec.note)}</p>`;
  } else {
    box.innerHTML=`<div class="rec-cover"><p class="rec-cover-title">${esc(rec.title)}</p></div>
      <p class="rec-title">${esc(rec.title)}</p><p class="rec-artist">${esc(rec.artist)}</p>
      <a class="card-link" href="${rec.link}" target="_blank" rel="noopener">Escuchar</a>
      <p class="rec-note">${esc(rec.note)}</p>`;
  }
}

function nextMonday(){
  const d=new Date(); d.setHours(0,0,0,0);
  const diff=(8-d.getDay())%7||7; d.setDate(d.getDate()+diff); return d;
}

function updateCountdown(){
  let diff=Math.max(0,nextMonday()-new Date());
  const d=Math.floor(diff/864e5); diff%=864e5;
  const h=Math.floor(diff/36e5); diff%=36e5;
  const m=Math.floor(diff/6e4); diff%=6e4;
  const s=Math.floor(diff/1e3);
  document.getElementById('countdown').textContent=
    `Próxima secret pick en ${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}

let disqusLoaded=false;
function initDisqus(){
  if(disqusLoaded) return; disqusLoaded=true;
  window.disqus_config=function(){ this.page.url=location.href; this.page.identifier='webo-secret-'+weekIndex(); };
  const sc=document.createElement('script');
  sc.src=`https://${DISQUS_SHORTNAME}.disqus.com/embed.js`;
  sc.setAttribute('data-timestamp',String(+new Date()));
  document.head.appendChild(sc);
}

document.getElementById('contact-form').addEventListener('submit', async e=>{
  e.preventDefault();
  const status=document.getElementById('form-status');
  status.textContent='Enviando...';
  try{
    const res=await fetch(FORM_ENDPOINT,{method:'POST',headers:{Accept:'application/json'},body:new FormData(e.target)});
    if(res.ok){ status.textContent='¡Mensaje enviado! Te respondo pronto 🎶'; e.target.reset(); }
    else throw 0;
  } catch{ status.textContent=`No se pudo enviar. Escríbeme a ${FALLBACK_EMAIL}`; }
});

document.addEventListener('DOMContentLoaded',()=>{
  setupGrid('gear-grid',    'gear-pager',    PRODUCTS_GEAR,    storeCard);
  setupGrid('plugins-grid', 'plugins-pager', PRODUCTS_PLUGINS, storeCard);
  setupGrid('gallery-grid', 'gallery-pager', PHOTOS,           galleryCard);
  setupGrid('events-grid',  'events-pager',  EVENTS_LIST,      eventCard);
  renderRec();
  updateCountdown();
  setInterval(updateCountdown, 1000);
});
</script>
</body>
</html>
